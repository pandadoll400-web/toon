<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Splat Notebook</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* 배경: 업로드해주신 벽돌 페인트 이미지 적용 */
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 노트 디자인 */
        #notebook {
            background-color: #fffdf5; /* 약간 누런 종이 색 */
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border-radius: 5px 20px 20px 5px;
            position: relative;
            /* 노트 줄무늬 (가로줄) */
            background-image: repeating-linear-gradient(transparent, transparent 29px, #add8e6 30px);
            background-position: 0 30px;
        }

        /* 노트 왼쪽 빨간 선 (마진) */
        #notebook::before {
            content: '';
            position: absolute;
            left: 40px;
            top: 0;
            bottom: 0;
            width: 2px;
            background-color: #ff9999;
        }

        #canvas {
            cursor: crosshair;
            display: block;
            border-radius: 5px 20px 20px 5px;
        }

        /* 툴바 UI */
        #toolbar {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        /* 색상 버튼 */
        .color-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }
        .color-btn:hover { transform: scale(1.15); }
        .color-btn.selected { 
            border: 3px solid #333; 
            transform: scale(1.2); 
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        #clear-btn {
            padding: 8px 20px;
            border: none;
            background: #ff4757;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }
        #clear-btn:hover { background: #ff6b81; }
    </style>
</head>
<body>

    <!-- 노트 영역 -->
    <div id="notebook">
        <!-- 캔버스 (그림 그리는 곳) -->
        <canvas id="canvas" width="700" height="500"></canvas>
    </div>

    <!-- 색상 및 도구 선택 툴바 -->
    <div id="toolbar">
        <div class="color-btn selected" style="background-color: #000000;" data-color="#000000"></div>
        <div class="color-btn" style="background-color: #ff007f;" data-color="#ff007f"></div>
        <div class="color-btn" style="background-color: #00f0ff;" data-color="#00f0ff"></div>
        <div class="color-btn" style="background-color: #00ff00;" data-color="#00ff00"></div>
        <div class="color-btn" style="background-color: #ffff00;" data-color="#ffff00"></div>
        
        <!-- 자유 색상 선택기 -->
        <input type="color" id="custom-color" value="#000000" style="margin-left: 10px; cursor: pointer;">
        
        <!-- 브러시 굵기 조절 -->
        <div style="margin-left: 20px; display: flex; align-items: center; gap: 5px;">
            <span style="font-size: 14px; color: #333;">굵기:</span>
            <input type="range" id="size-slider" min="2" max="50" value="8">
        </div>
        
        <button id="clear-btn" style="margin-left: 20px;">전체 지우기</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const colorBtns = document.querySelectorAll('.color-btn');
        const customColor = document.getElementById('custom-color');
        const sizeSlider = document.getElementById('size-slider');
        const clearBtn = document.getElementById('clear-btn');

        let isDrawing = false;
        let currentColor = '#000000';
        let currentSize = 8;
        let lastX = 0;
        let lastY = 0;

        // 브러시 끝을 둥글게 처리하여 자연스럽게 만듦
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        // 1. 색상 선택 이벤트
        colorBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                colorBtns.forEach(b => b.classList.remove('selected'));
                e.target.classList.add('selected');
                currentColor = e.target.getAttribute('data-color');
                customColor.value = currentColor; // 커스텀 컬러 값도 동기화
            });
        });

        customColor.addEventListener('input', (e) => {
            colorBtns.forEach(b => b.classList.remove('selected'));
            currentColor = e.target.value;
        });

        // 2. 굵기 조절 이벤트
        sizeSlider.addEventListener('input', (e) => {
            currentSize = e.target.value;
        });

        // 3. 지우기 이벤트
        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // 4. 그리기 로직 (마우스 이벤트)
        function draw(e) {
            if (!isDrawing) return;
            
            // 캔버스 내에서의 정확한 마우스 좌표 계산
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            ctx.beginPath();
            ctx.moveTo(lastX, lastY); // 이전 위치에서
            ctx.lineTo(x, y);         // 현재 위치까지 선을 긋기
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentSize;
            ctx.stroke();

            // 위치 업데이트
            lastX = x;
            lastY = y;
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            lastX = e.clientX - rect.left;
            lastY = e.clientY - rect.top;
        });

        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mouseout', () => isDrawing = false); // 캔버스 밖으로 나가면 그리기 중지
    </script>
</body>
</html>
